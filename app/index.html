<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Secure Documents</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #172554;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            background:
                radial-gradient(circle at 15% 20%, #f9a8d4 0, transparent 30%),
                radial-gradient(circle at 85% 25%, #93c5fd 0, transparent 32%),
                radial-gradient(circle at 75% 85%, #c4b5fd 0, transparent 35%),
                linear-gradient(135deg, #312e81, #6d28d9 48%, #2563eb);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(1px);
            pointer-events: none;
            animation: float 8s ease-in-out infinite alternate;
        }

        .orb-one {
            width: 180px;
            height: 180px;
            top: 6%;
            left: 8%;
            background: #fbcfe8;
            opacity: 0.45;
        }

        .orb-two {
            width: 240px;
            height: 240px;
            right: 5%;
            bottom: 4%;
            background: #a5f3fc;
            opacity: 0.35;
            animation-delay: -3s;
        }

        .orb-three {
            width: 90px;
            height: 90px;
            right: 18%;
            top: 12%;
            background: #fde68a;
            opacity: 0.55;
            animation-delay: -5s;
        }

        @keyframes float {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(-22px) rotate(12deg); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(18px);
            width: 100%;
            max-width: 420px;
            padding: 38px 34px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.28);
        }

        .logo {
            text-align: center;
            font-size: 31px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #4f46e5;
        }

        .logo span {
            color: #7c3aed;
        }

        .logo-icon {
            display: inline-flex;
            width: 52px;
            height: 52px;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border-radius: 17px;
            font-size: 27px;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px #7c3aed40;
        }

        h2 {
            text-align: center;
            margin: 18px 0 8px;
            font-size: 25px;
            color: #1e1b4b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 0 0 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-weight: 700;
            font-size: 14px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dbe3f0;
            border-radius: 11px;
            font-size: 15px;
            color: #1e293b;
            background: #f8faff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 4px #818cf820;
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(100deg, #4f46e5, #9333ea);
            color: white;
            border: none;
            border-radius: 11px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px #6366f140;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px #6366f155;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .register-link {
            text-align: center;
            margin: 22px 0 0;
            color: #64748b;
            font-size: 14px;
        }

        .register-link a {
            color: #7c3aed;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .note {
            margin: 24px 0 0;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
                overflow: auto;
            }

            .login-card {
                padding: 30px 23px;
            }

            .orb-one {
                width: 110px;
                height: 110px;
            }

            .orb-two {
                width: 150px;
                height: 150px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .orb {
                animation: none;
            }

            button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>
    <div class="orb orb-three" aria-hidden="true"></div>

    <main class="login-card">
        <div class="logo">
            <div class="logo-icon" aria-hidden="true">🔐</div>
            <div>Trust<span>Vault</span></div>
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Your secure space for document sharing</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign In Securely →</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="register-link">
            New to TrustVault?
            <a href="/register">Create an account</a>
        </p>

        <p class="note">
            🔒 Your documents deserve secure access.
        </p>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener(
            "submit", async function(event) {
                event.preventDefault();

                const message = document.getElementById("message");
                const button = document.querySelector("button[type='submit']");

                message.style.color = "#64748b";
                message.textContent = "Signing in...";
                button.disabled = true;

                try {
                    const response = await fetch("/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: document.getElementById("email").value,
                            password: document.getElementById("password").value
                        })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.detail || "Login failed");
                    }

                    message.style.color = "#15803d";
                    message.textContent =
                        "Login successful! Opening dashboard...";

                    window.setTimeout(function() {
                        window.location.href = "/dashboard";
                    }, 800);

                } catch (error) {
                    message.style.color = "#b91c1c";
                    message.textContent =
                        error.message === "Failed to fetch"
                        ? "Cannot connect to server. Check if it is running."
                        : error.message;
                } finally {
                    button.disabled = false;
                }
            }
        );
    </script>
</body>
</html>
