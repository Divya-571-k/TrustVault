
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Secure Documents</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #0f172a15;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            text-align: center;
        }

        h2 { text-align: center; margin-bottom: 8px; }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.6; cursor: wait; }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        .note {
            margin-top: 22px;
            color: #64748b;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="logo">🔐 TrustVault</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Secure document sharing</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" type="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   placeholder="Enter your password" required>

            <button type="submit">Sign In</button>
            <p id="message" role="status"></p>
        </form>

        <p class="note">
            Your documents deserve secure access.
        </p>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener(
            "submit", async function(event) {
                event.preventDefault();

                const message = document.getElementById("message");
                const button = document.querySelector("button[type='submit']");

                message.style.color = "#64748b";
                message.textContent = "Signing in...";
                button.disabled = true;

                try {
                    const response = await fetch("/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: document.getElementById("email").value,
                            password: document.getElementById("password").value
                        })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.detail || "Login failed");
                    }

                    message.style.color = "#15803d";
                    message.textContent = "Login successful! Opening dashboard...";

                    setTimeout(function() {
                        window.location.href = "/dashboard";
                    }, 800);

                } catch (error) {
                    message.style.color = "#b91c1c";
                    message.textContent =
                        error.message === "Failed to fetch"
                        ? "Cannot connect to server. Check if it is running."
                        : error.message;
                } finally {
                    button.disabled = false;
                }
            }
        );
    </script>
</body>
</html>
